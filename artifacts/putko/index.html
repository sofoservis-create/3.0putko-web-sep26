<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 blocked pinch-zoom entirely, which fails WCAG 2.2
         SC 1.4.4 (Resize Text) and makes the map, the date picker and the
         listing address unusable for anyone who needs to magnify them. There is
         no iOS input-zoom problem left to work around: that is fixed by giving
         inputs a 16px font size, not by disabling zoom for everyone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Putko</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-inter: 'Inter', sans-serif;
        --font-playfair: 'Playfair Display', serif;
        --font-poppins: 'Poppins', sans-serif;
        --font-dmsans: 'DM Sans', sans-serif;
        --font-fraunces: 'Fraunces', serif;
      }
      body {
        font-family: var(--font-inter);
      }
    </style>
  </head>
  <body class="font-inter">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
