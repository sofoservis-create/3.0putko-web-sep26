openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: test-auth
    description: Development-only Putko guest authentication
  - name: destinations
    description: Editorial destinations backed by current public accommodations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /destinations/catalog:
    get:
      operationId: getDestinationCatalog
      tags: [destinations]
      summary: Get the complete editorial destination catalog
      responses:
        "200":
          description: Complete destination catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationCatalogResponse"
  /destinations:
    get:
      operationId: getPopularDestinations
      tags: [destinations]
      summary: Get destinations with live public accommodation counts
      responses:
        "200":
          description: Non-empty destinations sorted by count and editorial order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularDestinationsResponse"
  /destinations/{slug}/accommodations:
    get:
      operationId: getDestinationResults
      tags: [destinations]
      summary: Search public accommodations using the same membership rule as destination counts
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching public accommodations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationSearchResponse"
        "404":
          description: Unknown destination
  /test-auth/register:
    post:
      operationId: registerTestGuest
      tags: [test-auth]
      summary: Register a development-only guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGuestRegistrationInput"
      responses:
        "201":
          description: Guest created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuestRegistrationResponse"
        "400":
          description: Invalid input or duplicate guest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "404":
          description: Test authentication is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /test-auth/login:
    post:
      operationId: loginTestGuest
      tags: [test-auth]
      summary: Log in a development-only guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGuestLoginInput"
      responses:
        "200":
          description: Guest authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuestLoginResponse"
        "400":
          description: Invalid credentials or unverified email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "404":
          description: Guest not found or test authentication disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /test-auth/verify-email/{token}:
    get:
      operationId: verifyTestGuestEmail
      tags: [test-auth]
      summary: Verify a development-only guest email
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "404":
          description: Test authentication is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /test-auth/me:
    get:
      operationId: getTestGuestProfile
      tags: [test-auth]
      summary: Get the authenticated test guest
      responses:
        "200":
          description: Current guest profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuest"
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
    patch:
      operationId: updateTestGuestProfile
      tags: [test-auth]
      summary: Update the authenticated test guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGuestProfileUpdate"
      responses:
        "200":
          description: Updated guest profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuest"
        "400":
          description: Invalid profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /test-auth/change-password:
    post:
      operationId: changeTestGuestPassword
      tags: [test-auth]
      summary: Change the authenticated test guest password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGuestPasswordChange"
      responses:
        "200":
          description: Password changed and sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Invalid current or new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /test-auth/host-activation:
    post:
      operationId: activateTestGuestHostMode
      tags: [test-auth]
      summary: Add development-only host capability to the current traveler
      responses:
        "200":
          description: Host capability activated or already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuest"
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /test-auth/mode:
    patch:
      operationId: switchTestGuestMode
      tags: [test-auth]
      summary: Switch the current development session between travel and host modes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGuestModeInput"
      responses:
        "200":
          description: Current profile with the updated active mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuest"
        "400":
          description: Host capability has not been activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /test-auth/logout:
    post:
      operationId: logoutTestGuest
      tags: [test-auth]
      summary: Revoke the current test guest session
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /test-auth/favorites:
    get:
      operationId: getTestGuestFavorites
      tags: [test-auth]
      summary: List favorite accommodation IDs for the authenticated test guest
      responses:
        "200":
          description: Favorite accommodation IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuestFavorites"
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
    post:
      operationId: addTestGuestFavorite
      tags: [test-auth]
      summary: Save an accommodation for the authenticated test guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGuestFavoriteInput"
      responses:
        "200":
          description: Updated favorite accommodation IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuestFavorites"
  /test-auth/favorites/{accommodationId}:
    delete:
      operationId: removeTestGuestFavorite
      tags: [test-auth]
      summary: Remove a saved accommodation for the authenticated test guest
      parameters:
        - name: accommodationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Updated favorite accommodation IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGuestFavorites"
  /test-auth/host-profile-photo/upload-url:
    post:
      operationId: requestHostProfilePhotoUpload
      tags: [test-auth]
      summary: Request an authenticated direct-upload URL for a Host profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostProfilePhotoUploadInput"
      responses:
        "200":
          description: Upload URL and host-owned staging object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfilePhotoUploadResponse"
        "400":
          description: Unsupported image format
        "401":
          description: Invalid or expired session
        "413":
          description: Image exceeds the size limit
  /test-auth/host-profile-photo/prepare:
    post:
      operationId: prepareHostProfilePhoto
      tags: [test-auth]
      summary: Validate, orient, crop and resize an uploaded Host profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostProfilePhotoPrepareInput"
      responses:
        "200":
          description: Managed photo variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfilePhotoPrepareResponse"
        "400":
          description: Invalid or corrupt image
        "401":
          description: Invalid or expired session
        "403":
          description: Staging image belongs to another host
        "413":
          description: Uploaded image exceeds the size limit
  /test-auth/host-profile-photo/{guestId}/{version}/{file}:
    get:
      operationId: getHostProfilePhoto
      tags: [test-auth]
      summary: Serve an immutable public Host profile image variant
      parameters:
        - { name: guestId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string, enum: [avatar.webp, profile.webp] } }
      responses:
        "200":
          description: WebP profile image
          content:
            image/webp:
              schema: { type: string, contentEncoding: binary }
        "404":
          description: Image not found
  /test-auth/host-profile-photo/{version}:
    delete:
      operationId: discardHostProfilePhoto
      tags: [test-auth]
      summary: Discard a prepared photo that is not the host's active profile photo
      parameters:
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Prepared image removed
        "401":
          description: Invalid or expired session
        "409":
          description: The image is the active profile photo
components:
  schemas:
    HostProfilePhotoUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: number, minimum: 1, maximum: 12582912 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, image/heif] }
    HostProfilePhotoUploadResponse:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string }
        objectPath: { type: string }
    HostProfilePhotoPrepareInput:
      type: object
      required: [objectPath, crop]
      properties:
        objectPath: { type: string }
        crop:
          type: object
          required: [x, y, size]
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
            size: { type: number, minimum: 0, maximum: 1 }
    HostProfilePhotoPrepareResponse:
      type: object
      required: [avatarUrl, profileUrl]
      properties:
        avatarUrl: { type: string }
        profileUrl: { type: string }
    DestinationCenter:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number
    Destination:
      type: object
      required: [id, slug, nameSk, nameEn, type, parentId, editorialOrder, center, radiusKm, image]
      properties:
        id:
          type: string
        slug:
          type: string
        nameSk:
          type: string
        nameEn:
          type: string
        type:
          type: string
          enum: [city, region, mountains, nature, spa, landmark]
        parentId:
          type: [string, "null"]
        editorialOrder:
          type: number
        center:
          $ref: "#/components/schemas/DestinationCenter"
        radiusKm:
          type: number
        image:
          type: [string, "null"]
    DestinationSummary:
      allOf:
        - $ref: "#/components/schemas/Destination"
        - type: object
          required: [count]
          properties:
            count:
              type: number
              minimum: 1
    DestinationCatalogResponse:
      type: object
      required: [version, destinations]
      properties:
        version:
          type: number
        destinations:
          type: array
          minItems: 35
          maxItems: 35
          items:
            $ref: "#/components/schemas/Destination"
    PopularDestinationsResponse:
      type: object
      required: [version, source, destinations]
      properties:
        version:
          type: number
        source:
          type: string
          enum: [legacy-public-accommodations]
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/DestinationSummary"
    DestinationSearchResponse:
      type: object
      required: [destinationId, accommodations, totalCount, totalPages, currentPage]
      properties:
        destinationId:
          type: string
        accommodations:
          type: array
          items:
            type: object
            additionalProperties: true
        totalCount:
          type: number
        totalPages:
          type: number
        currentPage:
          type: number
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    TestGuestRegistrationInput:
      type: object
      required: [name, lastName, email, phoneNumber, password, gender, role]
      properties:
        name:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        password:
          type: string
          minLength: 6
        gender:
          type: string
          enum: [male, female, other]
        role:
          type: string
          enum: [guest]
        language:
          type: string
        lang:
          type: string
          enum: [en, sk]
    TestGuestRegistrationResponse:
      type: object
      required: [message, verificationToken]
      properties:
        message:
          type: string
        verificationToken:
          type: string
    TestGuestLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        password:
          type: string
          minLength: 1
        lang:
          type: string
          enum: [en, sk]
    TestGuest:
      type: object
      required: [id, name, lastName, email, phoneNumber, gender, language, isVerified, capabilities, activeMode, hostActivatedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F-]{36}$'
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        phoneNumber:
          type: string
        gender:
          type: string
        language:
          type: string
        isVerified:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
            enum: [guest, host]
        activeMode:
          type: string
          enum: [guest, host]
        hostActivatedAt:
          type: ["string", "null"]
          format: date-time
    TestGuestLoginResponse:
      type: object
      required: [status, message, token, data, role]
      properties:
        status:
          type: boolean
        message:
          type: string
        token:
          type: string
        data:
          $ref: "#/components/schemas/TestGuest"
        role:
          type: string
          enum: [guest, host]
    TestGuestModeInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [guest, host]
    TestGuestProfileUpdate:
      type: object
      required: [name, lastName, phoneNumber, gender, language]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        gender:
          type: string
          enum: [male, female, other]
        language:
          type: string
          enum: [Slovak, English]
    TestGuestPasswordChange:
      type: object
      required: [currentPassword, newPassword, lang]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
        lang:
          type: string
          enum: [en, sk]
    TestGuestFavoriteInput:
      type: object
      required: [accommodationId]
      properties:
        accommodationId:
          type: string
          minLength: 1
          maxLength: 100
    TestGuestFavorites:
      type: object
      required: [favorites]
      properties:
        favorites:
          type: array
          items:
            type: string

