# render.yaml — Render Blueprint for Putko
#
# Scope, deliberately narrow: this defines ONLY new, additive infrastructure —
# the Postgres database and Redis-compatible store the rebuild plan
# (docs/REBUILD-PLAN.md) needs. It does NOT define the existing production
# Express/MongoDB backend, which is already deployed and managed directly in
# the Render dashboard. Blueprint sync matches services by name; defining an
# unfamiliar name for that service here risks creating a duplicate rather than
# adopting it, so it stays out of this file until it's deliberately migrated.
#
# What this buys you today (Phase 0):
#   putko-kv   replaces the hardcoded Upstash Redis credential (audit finding
#              C-05) with a Render-managed store in the same region as
#              everything else. Wire its connection string into the EXISTING
#              backend service's REDIS_URL env var by hand — see the runbook
#              at the bottom of this file.
#
# What this buys you starting Phase 1:
#   putko-db   the Postgres database the rebuild is built on — PostGIS,
#              unaccent, btree_gist, pg_trgm. Extensions are enabled with a
#              one-time SQL step after creation (Blueprints cannot run
#              CREATE EXTENSION) — see the runbook.
#
# Deliberately NOT here yet, added in Phase 1 once the code exists to point
# at (a service pointing at a directory with no buildable app just fails):
#   - the new Next.js web service
#   - the iCal sync / payout / invoice Render Cron Jobs
#
# Apply this in the Render dashboard: New → Blueprint → connect this repo →
# it will detect this file and propose putko-db and putko-kv for approval.

databases:
  - name: putko-db
    databaseName: putko
    user: putko
    region: frankfurt
    # Smallest paid tier to start. This has NO point-in-time recovery and no
    # high availability — fine for Phase 1-2 development against synthetic
    # and ETL'd data, NOT fine once real bookings depend on it. Upgrade the
    # plan (dashboard: Postgres → Settings → Change Plan, no code change
    # needed) before Phase 3 puts real money through it. Confirm current
    # plan names/prices in the dashboard — Render renames these periodically.
    plan: 0.5c-1g
    postgresMajorVersion: "17"

services:
  - name: putko-kv
    type: keyvalue
    region: frankfurt
    plan: 256mb
    # Required field. 0.0.0.0/0 is open-to-the-internet by IP but Render
    # still requires the store's own auth (the connection string's password)
    # to actually connect — this allow-list is a second, coarser gate.
    # Render's private networking means services IN this Render account can
    # already reach it privately; this list only matters for connections
    # from outside Render, which you should not need. If Render supports
    # scoping this to "internal only" by the time you apply this, prefer
    # that over 0.0.0.0/0.
    ipAllowList:
      - source: 0.0.0.0/0
        description: temporary — tighten once the existing backend's egress IP is known, or switch to internal-only if Render offers it
    maxmemoryPolicy: allkeys-lru

# ─────────────────────────────────────────────────────────────────────────
# RUNBOOK — the parts only you can do, in order
# ─────────────────────────────────────────────────────────────────────────
#
# 1. Render dashboard → New → Blueprint → connect this GitHub repo, branch
#    claude/putko-marketplace-audit-h1461w (or wherever this file lives once
#    merged) → Render detects render.yaml and shows putko-db + putko-kv →
#    Apply.
#
# 2. Enable extensions on putko-db. Blueprints cannot run SQL, so do this
#    once, by hand: Render dashboard → putko-db → Connect → copy the "PSQL
#    Command" → run it in a terminal → paste:
#
#      CREATE EXTENSION IF NOT EXISTS postgis;
#      CREATE EXTENSION IF NOT EXISTS unaccent;
#      CREATE EXTENSION IF NOT EXISTS btree_gist;
#      CREATE EXTENSION IF NOT EXISTS pg_trgm;
#
#    Confirm: \dx   should list all four.
#
# 3. Replace the leaked Redis credential (audit finding C-05):
#      a. putko-kv → Connect → copy the "Internal Redis URL" (internal is
#         cheaper and lower-latency than the external one; use it since the
#         backend and putko-kv are both on Render).
#      b. Existing backend service (the one already live) → Environment →
#         add REDIS_URL = <that connection string>.
#      c. Redeploy the existing backend. It now reads REDIS_URL from the
#         environment (patch 004) instead of the hardcoded Upstash URL.
#      d. Log into Upstash and DELETE the old database, or at minimum
#         rotate its password. The credential is in this repo's git history
#         permanently; deleting the database is the only way to be certain
#         it can never be used again.
#
# 4. Set DATABASE_URL for local/CI use ahead of Phase 1: putko-db → Connect
#    → copy the "External Database URL" into your local .env (never commit
#    it — .env is already gitignored) and into the new Next.js app's env
#    vars once that service exists.
#
# 5. Before Phase 3 (real money): upgrade putko-db's plan to one with
#    point-in-time recovery, and confirm automated backups are on
#    (Render dashboard → putko-db → Backups).
